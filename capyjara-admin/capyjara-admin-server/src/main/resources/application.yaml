spring:
  application:
    name: capyjara-admin-server
  cloud:
    nacos:
      discovery:
        namespace: public
        server-addr: 192.168.1.1:8848
        username: nacos
        group: DEFAULT_GROUP
      config:
        namespace: public
        server-addr: 192.168.1.1:8848
        username: nacos
        file-extension: yaml
        group: DEFAULT_GROUP
  config:
    import:
      # 优先级: 从低到高
      - nacos:swagger.yaml
      - nacos:flyway.yaml
      - nacos:redis.yaml
      - nacos:redisson.yaml
      - nacos:mysql.yaml
      - nacos:xxl-job.yaml
      - nacos:capyjara-web-security.yaml
      - nacos:${spring.application.name}.yaml
springdoc:
  info:
    version: @project.version@

auth:
  login:
    lock:
      enable: true
